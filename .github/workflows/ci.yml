name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.18", 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check connect.mjs
      - run: node --check bin.mjs
      - run: node test/smoke.mjs
      - run: node test/bin.mjs

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/pack-mcpb.sh
      - run: cmp connect.mjs build/mcpb/server/connect.mjs && cmp bin.mjs build/mcpb/server/bin.mjs

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/fetch-zk.sh
      - run: node build.mjs
      - run: git diff --exit-code connect.mjs
